name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "callbiseo-1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: callbiseo-apk
          path: callbiseo-*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 상규 통화비서 1.0.${{ github.run_number }}
          files: callbiseo-*.apk
          make_latest: true
      # 빌드가 실패하면 오류 로그를 ci-log 브랜치에 남긴다 (원인 확인용)
      - name: Save failure log
        if: failure()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/build.log 2>/dev/null || echo "no log" > /tmp/log/build.log
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 /tmp/log/build.log | head -200 > /tmp/log/errors.txt || true
          echo "${{ github.sha }}" > /tmp/log/sha.txt
          cd /tmp/log && git init -q -b ci-log
          git config user.name ci && git config user.email ci@example.com
          git add . && git commit -q -m "build failure ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-log
